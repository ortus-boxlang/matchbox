  #       run: cargo build --release
  # 
  #     - name: Build ESP32 fusion example
  #       env:
  #         RUSTUP_HOME: /home/esp/.rustup
  #         CARGO_HOME: /home/esp/.cargo
  #         RUSTUP_TOOLCHAIN: esp
  #         ESP_IDF_TOOLS_INSTALL_DIR: fromenv
  #       shell: bash
  #       run: |
  #         source "$IDF_PATH/export.sh"
  #         ./target/release/matchbox \
  #           docs/examples/native_fusion/app.bxs \
  #           --target esp32 \
  #           --chip esp32s3
  # 
  #         test -s target/fusion/app/target/xtensa-esp32s3-espidf/release/fusion_build \
  #           || { echo "ESP32 fusion smoke artifact is missing or empty"; exit 1; }

  aggregate-stubs:
    name: Aggregate All Stubs
    # needs: [build-stubs, build-esp32-stubs]
    needs: [build-stubs]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Stubs
        uses: actions/download-artifact@v4
        with:
          path: all-stubs
          pattern: stubs-*
          merge-multiple: true
      
      - name: Show stubs
        run: ls -R all-stubs

      - name: Upload Aggregated Stubs
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-stubs
          path: all-stubs/*

  build-clis:
    name: Build CLI - ${{ matrix.target }}
    needs: [aggregate-stubs, version]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MATCHBOX_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      # Always execute build scripts; cache compiler outputs, not their side effects.
      KACHE_BUILD_SCRIPT_CACHE: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            output_name: matchbox-linux-x64
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            output_name: matchbox-linux-x86
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            output_name: matchbox-linux-arm64
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            output_name: matchbox-linux-armv7
          - os: macos-latest
            target: x86_64-apple-darwin
            output_name: matchbox-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            output_name: matchbox-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: matchbox-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            output_name: matchbox-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - name: Download Aggregated Stubs
        id: download-stubs
        uses: actions/download-artifact@v4
        with:
          name: aggregated-stubs
          path: stubs

      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: cli-${{ matrix.target }}
          cache-bin: false
          cache-targets: ${{ matrix.target != 'x86_64-unknown-linux-gnu' }}
      - name: Cache Kache Store
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kache
          key: kache-v1-cli-${{ matrix.target }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            kache-v1-cli-${{ matrix.target }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}-
            kache-v1-cli-${{ matrix.target }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - name: Set Up Kache (Linux Pilot)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: kunobi-ninja/kache-action@b3491d5f4893a6513cb0162a72c735357f066569 # v1
        with:
          version: v1.0.0
          github-cache: false
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          max-size: 2GiB
          pr-comment: false

      - name: Install Cross-Compilers (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          version: 1.0

      - name: Add i386 Architecture
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo dpkg --add-architecture i386

      - name: Install Cross-Compilers (Linux x86)
        if: matrix.target == 'i686-unknown-linux-gnu'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-multilib libc6-dev-i386
          version: 1.0

      - name: Build CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          elif [[ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
          fi
          
          # One full-featured CLI, including the existing cross-platform stubs.
          cargo build --release --features cross-compile --target ${{ matrix.target }}

      - name: Verify CLI build metadata
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          VERSION_OUTPUT=$(target/${{ matrix.target }}/release/matchbox --version)
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fx "matchbox version $MATCHBOX_BUILD_VERSION" <<< "$VERSION_OUTPUT"
          grep -Fx "commit: $(git rev-parse --short HEAD)" <<< "$VERSION_OUTPUT"

      - name: Smoke test native runner BIFs
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          target/${{ matrix.target }}/release/matchbox \
            --target native \
            --output "$RUNNER_TEMP/native-runner-bifs" \
            tests/scripts/native_runner_bifs.bxs
          "$RUNNER_TEMP/native-runner-bifs"

      - name: Prepare Artifacts
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/matchbox$EXT" "dist/${{ matrix.output_name }}"
      
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  build-image:
    name: Build Docker Image
    needs: [build-clis, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a superseded snapshot
        if: inputs.snapshot == true
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/develop | cut -f1)
          test "$HEAD_SHA" = "$GITHUB_SHA" || { echo '::error::A newer develop commit supersedes this snapshot'; exit 1; }

      - name: Image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:v$VERSION"
            if [ "$SNAPSHOT" = true ]; then
              echo "$IMAGE:develop"
              echo "$IMAGE:be"
              echo "$IMAGE:snapshot"
            else
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux x64 CLI
        uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-x64
          path: docker-dist

      - name: Download Linux ARM64 CLI
        uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-arm64
          path: docker-dist

      - name: Prepare Docker binaries
        run: |
          mv docker-dist/matchbox-linux-x64 docker-dist/matchbox-amd64
          mv docker-dist/matchbox-linux-arm64 docker-dist/matchbox-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.build_version }}

      - name: Smoke test both image architectures
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx imagetools inspect "$IMAGE@${{ steps.image.outputs.digest }}" --raw > image-index.json
          for ARCH in amd64 arm64; do
            # The classic Docker store cannot cache two platforms at one index digest.
            DIGEST=$(jq -er --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' image-index.json)
            docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" --version
          done

  publish:
    name: Publish GitHub and S3 downloads
    needs: [build-clis, build-image, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BASE_VERSION: ${{ needs.version.outputs.base_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a superseded snapshot
        if: inputs.snapshot == true
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/develop | cut -f1)
          test "$HEAD_SHA" = "$GITHUB_SHA" || { echo '::error::A newer develop commit supersedes this snapshot'; exit 1; }

      - name: Download CLIs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: matchbox-*
          merge-multiple: true

      - name: Package checksums and version metadata
        run: |
          ARGS=()
          if [ "$SNAPSHOT" = true ]; then ARGS+=(--snapshot); fi
          python3 scripts/release.py package "${ARGS[@]}" \
            --build-id "$GITHUB_RUN_NUMBER" --revision "$GITHUB_SHA" --directory release-assets

      - name: Finalize stable changelog
        if: inputs.snapshot != true
        run: |
          cp CHANGELOG.md ORIGINAL_CHANGELOG.md
          python3 scripts/release.py finalize --released-version "$BASE_VERSION"

      - name: Snapshot notes
        if: inputs.snapshot == true
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          printf '%s\n' "Snapshot $BUILD_VERSION" "Revision: $GITHUB_SHA" '' \
            'Download matchbox-<os>-<arch> for the full CLI. Docker supports Linux amd64 and arm64.' \
            'SHA256SUMS and version.json describe this build.' > release_notes.md

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET }}
          aws-region: us-east-1

      - name: Upload versioned S3 downloads
        run: |
          CACHE_CONTROL='public,max-age=31536000,immutable'
          if [ "$SNAPSHOT" = true ]; then CACHE_CONTROL='no-cache'; fi
          aws s3 sync release-assets/ \
            "s3://downloads.ortussolutions.com/ortussolutions/matchbox/$VERSION/" \
            --acl public-read --cache-control "$CACHE_CONTROL"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.build_version }}
          body_path: release_notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ inputs.snapshot || false }}
          make_latest: ${{ inputs.snapshot != true }}

      - name: Save finalized changelog
        if: inputs.snapshot != true
        uses: actions/upload-artifact@v4
        with:
          name: finalized-changelog
          path: |
            CHANGELOG.md
            ORIGINAL_CHANGELOG.md

      - name: Upload evergreen S3 downloads
        run: |
          aws s3 sync release-assets/ \
            "s3://downloads.ortussolutions.com/ortussolutions/matchbox/$CHANNEL/" \
            --acl public-read --cache-control no-cache

  prep-next-release:
    name: Prepare the next minor release
    if: inputs.snapshot != true
    needs: [publish, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.base_version }}
      NEXT_VERSION: ${{ needs.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: finalized-changelog
          path: .release
      - name: Commit finalized changelog and next development version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .release/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "Finalize changelog for v$RELEASE_VERSION"
          # Normal pushes refuse concurrent branch updates; never overwrite them.
          git push origin HEAD:master
          git fetch origin develop
          git checkout -b prepare-next-release origin/develop
          python3 scripts/release.py bump --released-version "$RELEASE_VERSION"
          # Keep notes added during the release build under Unreleased.
          python3 scripts/release.py prepare-changelog --released-version "$RELEASE_VERSION" \
            --original-changelog .release/ORIGINAL_CHANGELOG.md --released-changelog .release/CHANGELOG.md
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Prepare v$NEXT_VERSION development snapshots"
          git push origin HEAD:develop
      - name: Build the next-version snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run snapshot.yml --ref develop
