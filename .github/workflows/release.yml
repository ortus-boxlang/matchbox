name: Release

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      snapshot:
        description: Build the next-version development snapshot
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  packages: write
  actions: write

# Serialize stable releases. The snapshot caller cancels superseded builds.
concurrency:
  group: matchbox-release-${{ inputs.snapshot && 'snapshot' || 'stable' }}
  cancel-in-progress: false

env:
  SNAPSHOT: ${{ inputs.snapshot || false }}

jobs:
  version:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.metadata.outputs.base_version }}
      version: ${{ steps.metadata.outputs.version }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      channel: ${{ steps.metadata.outputs.channel }}
      tag: ${{ steps.metadata.outputs.tag }}
      next_version: ${{ steps.metadata.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p test_release.py
      - name: Version metadata
        id: metadata
        run: |
          ARGS=()
          if [ "$SNAPSHOT" = true ]; then ARGS+=(--snapshot); fi
          python3 scripts/release.py metadata "${ARGS[@]}" \
            --build-id "$GITHUB_RUN_NUMBER" --revision "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse to replace a stable release
        if: inputs.snapshot != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length")
          if [ "$COUNT" != 0 ]; then
            echo "::error::Tag $RELEASE_TAG already exists. Merge the next develop version before releasing."
            exit 1
          fi

  test:
    name: Test - ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # build.rs reads Git/date and writes generated files outside OUT_DIR.
      KACHE_BUILD_SCRIPT_CACHE: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: test
          cache-bin: false
          # Cache only dependencies, not workspace or incremental artifacts.
          # On the Linux pilot Kache owns compiler artifacts instead.
          cache-targets: ${{ matrix.os != 'ubuntu-latest' }}
      - name: Cache Kache Store
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kache
          key: kache-v1-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            kache-v1-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}-
            kache-v1-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - name: Set Up Kache (Linux Pilot)
        if: matrix.os == 'ubuntu-latest'
        uses: kunobi-ninja/kache-action@b3491d5f4893a6513cb0162a72c735357f066569 # v1
        with:
          version: v1.0.0
          github-cache: false
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          max-size: 2GiB
          pr-comment: false
      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          VERSION="0.2.114"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-x86_64-unknown-linux-musl.tar.gz"
            DIR="wasm-bindgen-$VERSION-x86_64-unknown-linux-musl"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Check architecture
            ARCH=$(uname -m)
            if [[ "$ARCH" == "arm64" ]]; then
              URL="https://github.com/rustwasm/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-aarch64-apple-darwin.tar.gz"
              DIR="wasm-bindgen-$VERSION-aarch64-apple-darwin"
            else
              URL="https://github.com/rustwasm/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-x86_64-apple-darwin.tar.gz"
              DIR="wasm-bindgen-$VERSION-x86_64-apple-darwin"
            fi
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-x86_64-pc-windows-msvc.tar.gz"
            DIR="wasm-bindgen-$VERSION-x86_64-pc-windows-msvc"
          fi
          
          echo "Downloading wasm-bindgen from $URL"
          curl -L "$URL" | tar -xz
          echo "$(pwd)/$DIR" >> $GITHUB_PATH
      - name: Setup Firefox
        if: matrix.os == 'ubuntu-latest'
        uses: browser-actions/setup-firefox@v1
      - name: Install Browser Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Ensure basic browser dependencies are met
          sudo apt-get install -y libdbus-glib-1-2
          # Use Playwright to install all system dependencies for Firefox
          npx playwright install-deps firefox
      - name: Build Web Runner Stub (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p stubs
          cargo build --manifest-path crates/matchbox-runner/Cargo.toml --release --target wasm32-unknown-unknown --features js
          cp target/wasm32-unknown-unknown/release/matchbox_runner.wasm stubs/runner_stub_wasm32-unknown-unknown.wasm
          test -s stubs/runner_stub_wasm32-unknown-unknown.wasm
      - name: Run Tests
        run: cargo test

  build-stubs:
    name: Build Stubs - ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu, i686-unknown-linux-gnu, wasm32-wasip1, wasm32-unknown-unknown
            tag: linux-x86
          - os: ubuntu-24.04
            targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
            tag: linux-arm
          - os: macos-latest
            targets: x86_64-apple-darwin, aarch64-apple-darwin
            tag: macos
          - os: windows-latest
            targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, x86_64-pc-windows-gnu
            tag: windows
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}, wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: stubs-${{ matrix.tag }}
          workspaces: crates/matchbox-runner -> ../../target
          cache-bin: false
      
      - name: Install Cross-Compilers (Linux ARM)
        if: matrix.tag == 'linux-arm'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          version: 1.0

      - name: Add i386 Architecture
        if: matrix.tag == 'linux-x86'
        run: sudo dpkg --add-architecture i386

      - name: Install Cross-Compilers (Linux x86)
        if: matrix.tag == 'linux-x86'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-multilib libc6-dev-i386
          version: 1.0

      - name: Build Stubs
        shell: bash
        run: |
          mkdir -p stubs-out
          ROOT_DIR=$(pwd)
          cd crates/matchbox-runner
          IFS=', ' read -r -a TGS <<< "${{ matrix.targets }}"
          for target in "${TGS[@]}"; do
            echo "Building stub for $target..."
            
            # Setup linker for cross-compilation
            # Keep runner BIFs aligned with the MatchBox CLI's default features.
            FEATURES="bif-io,bif-http,bif-crypto,bif-cli"
            if [[ "$target" == "aarch64-unknown-linux-gnu" ]]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            elif [[ "$target" == "armv7-unknown-linux-gnueabihf" ]]; then
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
            elif [[ "$target" == "wasm32-unknown-unknown" ]]; then
              FEATURES="$FEATURES,js"
            fi

            cargo build --release --target "$target" --features "$FEATURES"

            # Determine source filename
            SRC_NAME="matchbox_runner"
            if [[ "$target" == *"windows"* ]]; then SRC_NAME="matchbox_runner.exe"; fi
            if [[ "$target" == *"wasm"* ]]; then SRC_NAME="matchbox_runner.wasm"; fi

            # Determine destination filename (wasm targets need explicit names to avoid collisions)
            DEST_NAME="runner_stub_$target"
            if [[ "$target" == *"windows"* ]]; then DEST_NAME="${DEST_NAME}.exe"
            elif [[ "$target" == "wasm32-wasip1" ]]; then DEST_NAME="runner_stub_wasip1.wasm"
            elif [[ "$target" == *"wasm"* ]]; then DEST_NAME="${DEST_NAME}.wasm"
            fi

            cp "$ROOT_DIR/target/$target/release/$SRC_NAME" "$ROOT_DIR/stubs-out/$DEST_NAME"
          done

      - name: Upload Stubs
        uses: actions/upload-artifact@v4
        with:
          name: stubs-${{ matrix.tag }}
          path: stubs-out/*

  # Temporarily disabled on 2026-04-20.
  # What we know:
  # - Cargo resolution drifted into an incompatible ESP Rust stack (`esp32-nimble` vs `esp-idf-*`).
  # - The idf-rust container also fails during tool setup because `esp-clang` needs `libxml2.so.2`.
  # Next steps:
  # - Regenerate and commit `crates/matchbox-esp32-runner/Cargo.lock` from a known-good ESP environment.
  # - Either install the missing system library in CI or move to a container image with the required runtime libs.
  # - Re-enable this job after the pinned dependency set and container/toolchain setup are both verified.
  build-esp32-stubs:
    if: false
    name: Build ESP32 Stubs - ${{ matrix.tag }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: xtensa-esp32-espidf
            artifact: runner_stub_esp32.elf
            tag: esp32
          - target: xtensa-esp32s3-espidf
            artifact: runner_stub_esp32s3.elf
            tag: esp32s3
          - target: riscv32imc-esp-espidf
            artifact: runner_stub_esp32c3.elf
            tag: esp32c3
    container:
      # espressif/idf-rust: all chip targets, Rust + ESP-IDF pre-installed.
      # Tag format: espressif/idf-rust:<chips>_<rust_ver> — update when newer versions appear on Docker Hub.
      image: espressif/idf-rust:all_1.92.0.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 Stubs
        env:
          BOXLANG_BYTECODE_PATH: ""
          # Point rustup/cargo at the esp user's pre-installed toolchain directories.
          # Running as root sets HOME=/github/home, so RUSTUP_HOME/CARGO_HOME would
          # default to empty paths and rustup can't find the 'esp' toolchain.
          RUSTUP_HOME: /home/esp/.rustup
          CARGO_HOME: /home/esp/.cargo
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/esp32/${{ matrix.tag }}
        shell: bash
        run: |
          mkdir -p stubs-out
          cd crates/matchbox-esp32-runner
          # rust-toolchain.toml pins channel = "esp", so cargo auto-selects the right toolchain
          cargo build --release --target ${{ matrix.target }}
          cp "$CARGO_TARGET_DIR/release/matchbox-esp32-runner" "../../stubs-out/${{ matrix.artifact }}"
          test -s "../../stubs-out/${{ matrix.artifact }}"

      - name: Upload ESP32 Stubs
        uses: actions/upload-artifact@v4
        with:
          name: stubs-esp32-${{ matrix.tag }}
          path: stubs-out/*

  # TODO: This job is currently disabled because it requires a more complex ESP-IDF configuration
  # to correctly handle nested cargo builds within the idf-rust container. 
  # We will come back to this to fully configure it in the future.
