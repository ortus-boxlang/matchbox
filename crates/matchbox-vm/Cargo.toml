[package]
name = "matchbox_vm"
version = "0.2.0"
edition = "2024"

[dependencies]
matchbox-macros = { path = "../matchbox-macros" }
anyhow = "1.0.102"
bincode = "1.3.3"
postcard = { version = "1.0", features = ["alloc", "use-std"] }
rand = "0.10.0"
getrandom = { version = "0.4.2" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
web-time = "1.1.0"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.13.1", features = ["v4", "fast-rng"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
regex = "1.11"
urlencoding = "2.1"
base64 = "0.22"

# Optional dependencies for BIFs
walkdir = { version = "2.5", optional = true }
zip = { version = "2.2", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
bzip2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
digest = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
cipher = { version = "0.4", optional = true }
des = { version = "0.8", optional = true }
blowfish = { version = "0.9", optional = true }
fs_extra = { version = "1.3", optional = true }
filetime = { version = "0.2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "espidf")))'.dependencies]
ctrlc = "3.4"
jni = { version = "0.21.1", features = ["invocation"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
crossterm = { version = "0.28", optional = true }
cranelift-jit = { version = "0.129.1", optional = true }
cranelift-frontend = { version = "0.129.1", optional = true }
cranelift-codegen = { version = "0.129.1", optional = true }
cranelift-module = { version = "0.129.1", optional = true }
cranelift-native = { version = "0.129.1", optional = true }
postgres = { version = "0.19", default-features = false, features = ["with-chrono-0_4"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.114", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3.77", optional = true }
web-sys = { version = "0.3.77", optional = true, features = ["Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "Response", "Headers", "Request", "RequestInit", "RequestMode", "console"] }

[features]
default = []
debugger = []
js = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "getrandom/wasm_js", "uuid/js"]
js-host-abi = []
jit = ["cranelift-jit", "cranelift-frontend", "cranelift-codegen", "cranelift-module", "cranelift-native"]
bif-io = ["walkdir", "fs_extra", "filetime"]
bif-http = ["reqwest"]
bif-zip = ["zip", "tar", "flate2", "bzip2"]
bif-crypto = ["sha2", "sha1", "md-5", "hmac", "digest", "aes", "cipher", "des", "blowfish"]
bif-cli = ["crossterm"]
bif-jni = ["jni"]
bif-datasource = ["postgres", "r2d2", "r2d2_postgres", "rusqlite"]
qoq = []
rusqlite = ["dep:rusqlite"]

[dev-dependencies]
wasm-bindgen-test = "0.3.50"
