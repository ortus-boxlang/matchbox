[package]
name = "matchbox_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
matchbox_vm = { path = "../matchbox-vm" }
ratatui = "0.29"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"

[dev-dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
serde_json = "1.0"
