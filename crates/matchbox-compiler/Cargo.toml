[package]
name = "matchbox_compiler"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive", "rc"] }
matchbox_vm = { path = "../matchbox-vm" }
matchbox_parser = { path = "../matchbox-parser" }

[features]
default = ["bxm"]
bxm = []
qoq = ["matchbox_vm/qoq"]
